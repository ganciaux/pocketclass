<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Matches the header (slate strip, `neutral`) of each theme. -->
		<meta name="theme-color" content="#1f2127" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="PocketClass" />
		<!-- Day / night chosen in « Mon profil » (src/lib/theme.ts), applied before the first paint. -->
		<script>
			try {
				var theme = localStorage.getItem('pocketclass.theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = 'pocketclass-' + theme;
					var bar = theme === 'dark' ? '#131418' : '#1f2127';
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
						meta.content = bar;
					});
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
